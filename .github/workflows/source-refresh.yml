name: Official source refresh

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Refresh source metadata
        run: npm run refresh:source-data

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/official-source-check.json
          if git diff --cached --quiet; then
            echo "No source refresh changes to commit."
          else
            git commit -m "chore: refresh official source check metadata"
            git push
          fi

